version: "3.8"

services:
  # 1. RTSP 서버 (MediaMTX)
  rtsp-server:
    image: bluenviron/mediamtx:latest
    container_name: rtsp-server
    network_mode: host
    restart: always

  # 2. GStreamer 송출기 (미리 빌드된 이미지 사용)
  gst-publisher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gst-publisher
    network_mode: host
    devices:
      - "/dev/video0:/dev/video0"
    depends_on:
      - rtsp-server
    # Orin Nano에 최적화된 x264enc 파이프라인
    command: >
      v4l2src device=/dev/video0 ! 
      video/x-raw,width=640,height=480,framerate=30/1 ! 
      videoconvert ! 
      x264enc tune=zerolatency bitrate=1500 speed-preset=ultrafast ! 
      rtph264pay config-interval=1 pt=96 ! 
      rtspclientsink location=rtsp://localhost:8554/live
